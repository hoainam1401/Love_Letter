name: Build offline game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Love_Letter_Base_offline/**"
      - ".github/workflows/build-offline-games.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Love_Letter_Base_offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Love_Letter_Base_offline/requirements.txt
      - name: Install packager
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LoveLetterOffline.spec
      - uses: actions/upload-artifact@v4
        with:
          name: LoveLetterOffline-Windows
          path: Love_Letter_Base_offline/dist/LoveLetterOffline.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Love_Letter_Base_offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache cmake gettext git libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libssl-dev libtool libtool-bin pkg-config unzip zip zlib1g-dev
          python -m pip install buildozer "cython<3"
      - name: Build APK
        run: buildozer android debug
      - name: Give APK a stable name
        run: |
          mkdir -p dist
          cp bin/*.apk dist/LoveLetterOffline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LoveLetterOffline-Android
          path: Love_Letter_Base_offline/dist/LoveLetterOffline.apk
          if-no-files-found: error
          retention-days: 30
