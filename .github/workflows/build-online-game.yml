name: Build online game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Love_Letter_Base_online/**"
      - "Love_Letter_Base_offline/gui.py"
      - "Love_Letter_Base_offline/images/**"
      - ".github/workflows/build-online-game.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Love_Letter_Base_online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Love_Letter_Base_online/requirements.txt
      - name: Install packager
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LoveLetterOnline.spec
      - uses: actions/upload-artifact@v4
        with:
          name: LoveLetterOnline-Windows
          path: Love_Letter_Base_online/dist/LoveLetterOnline.exe
          if-no-files-found: error
          retention-days: 30
